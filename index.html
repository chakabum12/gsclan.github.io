<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>좋은사람들</title>
  <style>
    html, body { height:100%; margin:0; }
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      background:#0b0f14;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color:#fff;
    }
    .box{
      width:min(420px, 92vw);
      padding:28px;
      border:1px solid #d6b46a;
      border-radius:14px;
      background:rgba(0,0,0,.65);
      text-align:center;
    }
    h1{ margin:0 0 18px; color:#d6b46a; letter-spacing:2px; }
    a{
      display:block;
      margin:12px 0;
      padding:14px 16px;
      border-radius:12px;
      border:1px solid #d6b46a;
      color:#fff;
      text-decoration:none;
      font-weight:700;
      background:rgba(214,180,106,.12);
    }
    a:hover{ filter:brightness(1.1); }
  </style>
</head>
<body>
  <div class="box">
    <h1>좋은사람들</h1>
    <a href="https://open.kakao.com/o/pid6wygi" target="_blank" rel="noopener">카카오 오픈채팅 입장</a>
    <a href="https://discord.gg/r2BKzVw3" target="_blank" rel="noopener">디스코드 입장</a>
  </div>
</body>
</html>
